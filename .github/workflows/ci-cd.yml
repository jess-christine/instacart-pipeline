name: Instacart CI/CD

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "ops/**"
      - "scripts/**"
      - ".github/workflows/ci-cd.yml"
      - ".github/dependabot.yml"
      - ".gitignore"
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "ops/**"
      - "scripts/**"
      - ".github/workflows/ci-cd.yml"
      - ".github/dependabot.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

# PR runs are collapsed to the newest commit. Environment deployments are
# queued so a deployment already in progress is never canceled halfway through.
concurrency:
  group: instacart-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate SQL, notebooks, job manifest, and repository size
        run: python3 scripts/ci_validate.py

      - name: Check whitespace errors
        run: git diff --check

  deploy_development:
    name: Deploy and run Databricks job (development)
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: development

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy and run exact commit in development
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_ENVIRONMENT: development
          DATABRICKS_JOB_NAME: instacart-pipeline-development
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/deploy_databricks_job.sh

  deploy_production:
    name: Deploy and run Databricks job (production)
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy and run exact commit in production
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_ENVIRONMENT: production
          DATABRICKS_JOB_NAME: instacart-pipeline-production
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/deploy_databricks_job.sh
